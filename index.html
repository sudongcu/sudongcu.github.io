<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Seasonal theme: ?season=… wins, then the saved choice, else the calendar (mirrors src/theme/SeasonProvider.jsx) -->
    <script>
      (function () {
        var seasons = ['spring', 'summer', 'autumn', 'winter'];
        var s = null;
        try {
          s = new URLSearchParams(location.search).get('season');
          if (seasons.indexOf(s) < 0) s = localStorage.getItem('dg.season');
        } catch (e) { s = null; }
        if (seasons.indexOf(s) < 0) {
          var m = new Date().getMonth() + 1;
          s = m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter';
        }
        document.documentElement.setAttribute('data-season', s);
        // The lab has no weather: a fixed palette (mirrors src/pages/lab/useLabPalette.js)
        if (/^\/lab(\/|$)/.test(location.pathname)) document.documentElement.setAttribute('data-lab', '');
      })();
    </script>
